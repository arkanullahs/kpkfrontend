  <style>
    :root {
      /* ---------------- TOKENS ----------------
         The same three layers, and the same names, as the static pages'
         sheet (kpk_backend/pipeline/pages.py :root): layer 1 is measured off
         the logo and is the only place a literal appears, layer 2 gives roles,
         layer 3 assembles composite surfaces. A component and a guide page
         spell the same colour the same way. */
      --c-teal-900:#12211f; --c-teal-800:#161b1b; --c-teal-700:#1d4340; --c-teal-600:#2b5f5a;
      --c-aqua-300:#a9cfc9; --c-aqua-200:#cfe4df; --c-aqua-100:#e7efee;
      --c-amber-600:#c25e00; --c-amber-700:#a04d00;
      --c-n-800:#2b3a38; --c-n-700:#3d4c4a; --c-n-500:#63726f; --c-n-400:#8a9997;
      --c-n-300:#aebcba; --c-n-200:#d2dbda; --c-n-050:#f2f5f5; --c-white:#fff;
      /* a functional status colour, not a brand one -- it exists so a real
         hardware defect cannot read the same as "worth a look" */
      --c-danger:#c4503c;
      --rgb-ink:18,33,31; --rgb-white:255,255,255; --rgb-teal:43,95,90;
      --rgb-amber:194,94,0; --rgb-danger:196,80,60;

      /* amber is the mark (prices, the accent word, chip hover); teal carries
         links, labels, buttons and fills; on dark the accent is the aqua */
      --ac:var(--c-amber-600); --acd:var(--c-amber-700);
      --amsoft:rgba(var(--rgb-amber),.10); --amline:rgba(var(--rgb-amber),.28);
      --teal:var(--c-teal-600); --tealD:var(--c-teal-700); --tealL:var(--c-aqua-100);
      --aqua:var(--c-aqua-300); --aquaL:var(--c-aqua-200);
      --lnk:var(--c-teal-700);
      --tint:rgba(var(--rgb-teal),.08); --tint2:rgba(var(--rgb-teal),.24);
      --danger:var(--c-danger); --dangerL:rgba(var(--rgb-danger),.12);
      --bg:var(--c-n-050); --card:var(--c-white); --panel:var(--c-teal-800);
      --ink:var(--c-teal-900); --ink2:var(--c-n-800); --tx:var(--c-n-700);
      --mut:var(--c-n-500); --mut2:var(--c-n-400); --faint:var(--c-n-300);
      --rule:var(--c-n-200); --tone:rgba(var(--rgb-ink),.045);
      --onp:var(--c-white); --onp2:rgba(var(--rgb-white),.66);
      --onp3:rgba(var(--rgb-white),.30); --onpfill:rgba(var(--rgb-white),.07);
      --r:2px;

      --sh-hair:inset 0 0 0 1px var(--rule);
      --sh-card:inset 0 0 0 1px var(--rule),inset 0 1px 0 rgba(var(--rgb-white),.9),
        0 1px 2px rgba(var(--rgb-ink),.05),0 10px 20px -14px rgba(var(--rgb-ink),.28);
      --sh-hover:inset 0 0 0 1px var(--teal),0 2px 4px rgba(var(--rgb-ink),.07),
        0 16px 30px -18px rgba(var(--rgb-ink),.34);
      --sh-lift:inset 0 0 0 1px var(--rule),inset 0 1px 0 rgba(var(--rgb-white),.9),
        0 2px 4px rgba(var(--rgb-ink),.06),0 22px 40px -24px rgba(var(--rgb-ink),.40);
      --hdr-bg:linear-gradient(180deg,rgba(var(--rgb-white),.72),rgba(246,250,249,.58));
      --hdr-sh:inset 0 1px 0 rgba(var(--rgb-white),.95),
        inset 0 -1px 0 rgba(var(--rgb-white),.30),0 1px 12px -4px rgba(var(--rgb-ink),.14);
      --prism:linear-gradient(90deg,rgba(143,214,255,.85),rgba(185,242,228,.75) 22%,
        rgba(255,255,255,0) 44%,rgba(255,215,164,.75) 66%,rgba(255,159,201,.7) 84%,
        rgba(143,214,255,.8));
      --plate:radial-gradient(115% 95% at 32% 14%,var(--c-white),
        rgba(240,245,244,.9) 62%,rgba(226,235,233,.75));

      --f-sans: 'Libre Franklin', 'Anek Bangla', system-ui, sans-serif;
      --f-display: 'Libre Franklin', 'Anek Bangla', system-ui, sans-serif;
      --f-serif: 'Libre Franklin', 'Anek Bangla', system-ui, sans-serif;
      --f-bn: 'Anek Bangla', 'Libre Franklin', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    button, input { font-family: inherit; }
    /* touch devices keep the clean edge; desktop shows a slim scrollbar
       so long pages are draggable (feedback #10) */
    ::-webkit-scrollbar { width: 0; height: 0; }
    @media (pointer: fine) and (min-width: 700px) {
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--faint); border-radius: var(--r);
        border: 2px solid var(--bg); background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--mut2); border: 2px solid var(--bg); background-clip: padding-box; }
      html { scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
    }
    ::selection { background: var(--tint2); }
    /* hide number-input spinners — the budget field is styled bespoke */
    input.kbudget::-webkit-outer-spin-button,
    input.kbudget::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input.kbudget { -moz-appearance: textfield; }
    .ktrait::placeholder, .kbudget::placeholder { color: var(--faint); }
    @keyframes kfade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes kpop { from { opacity: 0; transform: scale(.96) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes krise { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: none; } }
    @keyframes kspin { to { transform: rotate(360deg); } }
    /* pulsing "live" dot for the header status badge */
    @keyframes kdot {
      0%   { box-shadow: 0 0 0 0 rgba(var(--rgb-teal),.5); }
      70%  { box-shadow: 0 0 0 6px rgba(var(--rgb-teal),0); }
      100% { box-shadow: 0 0 0 0 rgba(var(--rgb-teal),0); }
    }
    .k-live { animation: kdot 1.8s ease-out infinite; }
    /* header tagline + divider collapse on narrow screens to keep the bar clean */
    /* the slogan is a full sentence — it needs a wide bar or it crowds the
       stock badge (owner 2026-07-26), so it leaves well before the phone sizes */
    @media (max-width: 940px) { .khtag, .khdiv { display: none !important; } }
    /* stock badge overflows into the logo on very narrow phones */
    @media (max-width: 420px) { .khstock { display: none !important; } }

    /* interaction layer — the inline styles set the look, these add the feel.
       Pressable elements lift on hover, depress on click, and brighten if they
       carry a gradient. Keeps the whole app feeling alive without per-component
       hover state. */
    .k-press { transition: transform .16s cubic-bezier(.2,.7,.2,1), box-shadow .2s ease, filter .16s ease; will-change: transform; }
    @media (hover: hover) {
      .k-press:hover { transform: translateY(-2px); }
      .k-lift:hover { box-shadow: var(--sh-hover) !important; }
      .k-glow:hover { filter: brightness(1.05) saturate(1.03); }
    }
    .k-press:active { transform: translateY(0) scale(.99); transition-duration: .05s; }

    /* the one CTA people were reading past: a slow arrow nudge so the eye
       lands on it (owner 2026-07-26) */
    @keyframes knudge { 0%,72%,100% { transform: none } 82% { transform: translateX(4px) } }
    .k-nudge { animation: knudge 2.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .k-nudge { animation: none } }

    /* staggered entrance for a list of cards */
    .k-stagger > * { animation: krise .5s cubic-bezier(.2,.7,.2,1) both; }
    .k-stagger > *:nth-child(1){animation-delay:.02s}
    .k-stagger > *:nth-child(2){animation-delay:.07s}
    .k-stagger > *:nth-child(3){animation-delay:.12s}
    .k-stagger > *:nth-child(4){animation-delay:.17s}
    .k-stagger > *:nth-child(5){animation-delay:.22s}
    .k-stagger > *:nth-child(6){animation-delay:.27s}
    .k-stagger > *:nth-child(7){animation-delay:.32s}

    /* The step swap. One pair of keyframes with a direction sign, so Back runs
       the same animation mirrored rather than needing its own.
       The leaving layer uses `filter`, NOT `backdrop-filter`: it blurs ITSELF
       on the way out, which is cheap and lasts 260ms. Only the rail carries a
       real backdrop blur continuously. */
    @keyframes kstepin {
      from { opacity: 0; transform: translateX(calc(8% * var(--dir, 1))) scale(.98); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes kstepout {
      from { opacity: 1; transform: none; filter: blur(0); }
      to   { opacity: 0; transform: translateX(calc(-8% * var(--dir, 1))) scale(.98); filter: blur(6px); }
    }
    .k-step { animation: kstepin .32s cubic-bezier(.2,.7,.2,1) both; }
    .k-step-out { animation: kstepout .26s cubic-bezier(.4,0,1,1) both; pointer-events: none; }

    /* the rail's live position, for screen readers only */
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
               overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

    /* keyboard accessibility — visible focus ring that respects the accent */
    :focus { outline: none; }
    :focus-visible { outline: 2.5px solid var(--teal); outline-offset: 3px; border-radius: var(--r); }

    /* The header is the only glass in the app: real content scrolls under it.
       Over flat paper, glass is dirty translucency rather than material. */
    @supports (backdrop-filter: url(#lensglass)) {
      .k-glass { backdrop-filter: blur(13px) saturate(1.8) url(#lensglass) !important;
                 -webkit-backdrop-filter: blur(13px) saturate(1.8) url(#lensglass) !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .k-glass { backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
                 background: var(--card) !important; }
    }

    /* The second and last glass: a modal scrim. It qualifies for the same
       reason the header does -- live content sits behind it, so the blur is
       material rather than decoration.
       It needs its OWN class, not .k-glass. Two of that rule's parts are
       header-specific and wrong full-screen: url(#lensglass) is an edge
       refraction, and the reduced-transparency fallback resolves to
       `background: var(--card)`, which would paint the whole viewport as an
       opaque white card with the (also white) sheet invisible on top of it.
       A scrim that cannot blur must DARKEN. */
    .k-scrim { backdrop-filter: blur(13px) saturate(1.8); -webkit-backdrop-filter: blur(13px) saturate(1.8); }
    @media (prefers-reduced-transparency: reduce) {
      .k-scrim { backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
                 background: rgba(var(--rgb-ink), .74) !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- the refraction filter the header's backdrop-filter points at. It has to
       live inside <body>: browsers hoist a bare <svg> out of <head> and the id
       never resolves. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs>
    <filter id="lensglass" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.011" numOctaves="2" seed="11" result="turb" />
      <feGaussianBlur in="turb" stdDeviation="2.4" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="11" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs></svg>

</body>
